<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bienvenue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<meta name="color-scheme" content="dark">
<style>
:root{
  --void:#08060f; --slab:#100c1f; --slab2:#171232; --line:#2a2150;
  --arcane:#8b6cff; --arcane-lt:#c9b6ff; --gold:#ffc94a; --fus:#ff5ec7;
  --ink:#ece7ff; --mut:#8f86b8;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:var(--mono)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:100vh;padding:16px;overflow-x:hidden}

/* La bande */
.banner{
  --mx:50%; --my:50%; --rx:0deg; --ry:0deg;
  position:relative;width:100%;max-width:900px;padding:48px 32px;
  border:1px solid var(--line);border-radius:14px;
  background:
    radial-gradient(420px circle at var(--mx) var(--my), rgba(139,108,255,.28), transparent 60%),
    linear-gradient(135deg,var(--slab),var(--slab2));
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(201,182,255,.04);
  text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .15s ease-out;overflow:hidden;
}
.banner::before{ /* liseré animé */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(90deg,var(--arcane),var(--fus),var(--gold),var(--arcane));
  background-size:300% 100%;animation:flow 6s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.7;pointer-events:none;
}
@keyframes flow{to{background-position:300% 0}}

.name{
  font-size:clamp(2rem,7vw,4.2rem);font-weight:700;letter-spacing:.04em;line-height:1.1;
  display:flex;flex-wrap:wrap;justify-content:center;gap:0 .45em;
}
.name .word{display:inline-flex}
.name span.l{
  display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .25s;
}
.name span.l:hover{transform:translateY(-10px) scale(1.15);color:var(--gold)}
.first{color:var(--arcane-lt)}
.last{color:var(--ink)}

.msg{
  margin-top:20px;font-size:clamp(1rem,2.6vw,1.3rem);color:var(--mut);min-height:1.6em;
}
.msg .caret{display:inline-block;width:.6em;color:var(--fus);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.hint{margin-top:28px;font-size:.75rem;color:var(--mut);opacity:.6;letter-spacing:.1em;text-transform:uppercase}

.spark{
  position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;
  animation:pop .8s ease-out forwards;
}
@keyframes pop{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}

/* Carte du jeu */
.game{
  width:100%;max-width:900px;display:flex;align-items:center;gap:20px;
  padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--slab);
}
.game img{width:88px;height:88px;border-radius:18px;flex-shrink:0;
  box-shadow:0 0 24px rgba(139,108,255,.35)}
.game .info{flex:1;min-width:0}
.game h2{font-size:1.25rem;color:var(--arcane-lt)}
.game p{margin-top:6px;font-size:.9rem;color:var(--mut);line-height:1.45}
.play{
  flex-shrink:0;display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;border-radius:10px;text-decoration:none;
  font:700 1rem var(--mono);letter-spacing:.06em;color:var(--void);
  background:linear-gradient(135deg,var(--gold),var(--fus));
  box-shadow:0 6px 20px rgba(255,94,199,.3);transition:transform .15s,box-shadow .15s;
}
.play:hover,.play:focus-visible{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 28px rgba(255,94,199,.45)}
.play:active{transform:scale(.97)}
@media (max-width:600px){
  .game{flex-direction:column;text-align:center}
  .play{width:100%;justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  .banner{transition:none;transform:none}
  .banner::before,.msg .caret{animation:none}
}
</style>
</head>
<body>

<div class="banner" id="banner" role="button" tabindex="0" aria-label="Bande de bienvenue, cliquer pour changer le message">
  <h1 class="name" id="name"></h1>
  <p class="msg"><span id="msg"></span><span class="caret">▌</span></p>
  <p class="hint">Survole · clique</p>
</div>

<section class="game" aria-labelledby="game-title">
  <img src="icon-192.png" alt="">
  <div class="info">
    <h2 id="game-title">Mage Survivor</h2>
    <p>Mon jeu : un survivor-like magique. Tu ne vises pas, tu construis ton build et tu esquives.</p>
  </div>
  <a class="play" id="jouer" href="index.html">▶ Jouer</a>
</section>

<script>
// ✏️ Modifie ces valeurs avec ton prénom, ton nom et tes messages
const PRENOM = "Loan";
const NOM = "Mourier";
const MESSAGES = [
  "Bienvenue sur ma page !",
  "Ravi de te voir ici ✨",
  "Installe-toi, la magie commence bientôt.",
];

const banner = document.getElementById("banner");
const nameEl = document.getElementById("name");
const msgEl = document.getElementById("msg");

// Nom découpé en lettres pour l'effet au survol
function word(text, cls){
  const w = document.createElement("span");
  w.className = "word " + cls;
  for (const ch of text){
    const s = document.createElement("span");
    s.className = "l";
    s.textContent = ch;
    w.appendChild(s);
  }
  return w;
}
nameEl.append(word(PRENOM, "first"), word(NOM.toUpperCase(), "last"));

// Message tapé lettre par lettre
let msgIndex = 0, typing = null;
function typeMessage(text){
  clearInterval(typing);
  msgEl.textContent = "";
  let i = 0;
  const chars = [...text];
  typing = setInterval(() => {
    msgEl.textContent += chars[i++];
    if (i >= chars.length) clearInterval(typing);
  }, 45);
}
typeMessage(MESSAGES[0]);

// Inclinaison et halo qui suivent le pointeur
banner.addEventListener("pointermove", e => {
  const r = banner.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  banner.style.setProperty("--mx", x * 100 + "%");
  banner.style.setProperty("--my", y * 100 + "%");
  banner.style.setProperty("--ry", (x - .5) * 10 + "deg");
  banner.style.setProperty("--rx", (.5 - y) * 10 + "deg");
});
banner.addEventListener("pointerleave", () => {
  banner.style.setProperty("--rx", "0deg");
  banner.style.setProperty("--ry", "0deg");
});

// Clic : étincelles + message suivant
const colors = ["#8b6cff", "#ff5ec7", "#ffc94a", "#c9b6ff"];
function burst(x, y){
  for (let i = 0; i < 14; i++){
    const s = document.createElement("span");
    s.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d + "px");
    banner.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  }
}
function next(x, y){
  burst(x, y);
  msgIndex = (msgIndex + 1) % MESSAGES.length;
  typeMessage(MESSAGES[msgIndex]);
}
banner.addEventListener("click", e => {
  const r = banner.getBoundingClientRect();
  next(e.clientX - r.left, e.clientY - r.top);
});
banner.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){
    e.preventDefault();
    next(banner.clientWidth / 2, banner.clientHeight / 2);
  }
});

/* Trou noir : disque d'accrétion en orbite, horizon, anneau de photons */
function creerTrouNoir(){
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;inset:0";
  // 3 calques : disque arrière (traînées), horizon, disque avant (traînées)
  const calques = [0, 1, 2].map(() => {
    const c = document.createElement("canvas");
    c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block";
    box.appendChild(c);
    return { c, x: c.getContext("2d") };
  });
  // halos pré-rendus : bien plus fluide que des dégradés à chaque particule
  const sprite = (coeur, teinte) => {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, coeur); g.addColorStop(.25, teinte); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return c;
  };
  const chaud = sprite("#fff", "rgba(255,201,74,.85)");
  const tiede = sprite("#ffe3f4", "rgba(255,94,199,.75)");
  const froid = sprite("#efe8ff", "rgba(139,108,255,.7)");
  const parts = [];
  for (let i = 0; i < 520; i++) parts.push({
    r: 1.3 + Math.pow(Math.random(), 1.6) * 2.3, a: Math.random() * 6.283, s: .5 + Math.random()
  });
  let W = 0, H = 0, d = 1;
  function taille(){
    d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for (const k of calques){ k.c.width = W * d; k.c.height = H * d; k.x.setTransform(d, 0, 0, d, 0, 0); }
  }
  taille();
  addEventListener("resize", taille);
  const incl = -.32, ci = Math.cos(incl), si = Math.sin(incl), plat = .26;

  // R : rayon de l'horizon ; vitesse : rotation du disque ; chute : aspiration ; eclat : opacité du disque
  function dessiner(dt, cx, cy, R, vitesse, chute, eclat){
    const [arr, mil, ava] = calques;
    for (const k of [arr, ava]){ // efface doucement : laisse des traînées
      k.x.globalCompositeOperation = "destination-out";
      k.x.fillStyle = "rgba(0,0,0,.28)"; k.x.fillRect(0, 0, W, H);
      k.x.globalCompositeOperation = "lighter";
    }
    mil.x.clearRect(0, 0, W, H);
    if (R < .5) return;
    for (const p of parts){
      p.a += dt * vitesse * 1.9 * Math.pow(p.r, -1.5);
      p.r -= dt * chute * .5 / p.r;
      if (p.r < 1.04){ p.r = 3.2 + Math.random() * .5; p.a = Math.random() * 6.283; }
      const ox = Math.cos(p.a) * p.r * R, oy = Math.sin(p.a) * p.r * R * plat;
      const px = cx + ox * ci - oy * si, py = cy + ox * si + oy * ci;
      const doppler = .35 + .65 * (.5 - .5 * Math.cos(p.a)); // côté qui vient vers nous plus brillant
      const k = Math.sin(p.a) < 0 ? arr : ava;
      const t = Math.min(R * .16 * p.s * (1.6 - p.r * .25), 70);
      k.x.globalAlpha = Math.min(1, doppler * eclat * (p.r < 1.3 ? (p.r - 1.04) / .26 : 1));
      k.x.drawImage(p.r < 1.8 ? chaud : p.r < 2.5 ? tiede : froid, px - t / 2, py - t / 2, t, t);
    }
    arr.x.globalAlpha = ava.x.globalAlpha = 1;
    const x = mil.x;
    // lueur diffuse
    let g = x.createRadialGradient(cx, cy, R, cx, cy, R * 4);
    g.addColorStop(0, `rgba(139,108,255,${.35 * eclat})`); g.addColorStop(1, "rgba(139,108,255,0)");
    x.fillStyle = g; x.fillRect(cx - R * 4, cy - R * 4, R * 8, R * 8);
    // image du disque déviée par la gravité : halo par-dessus et par-dessous l'horizon
    g = x.createRadialGradient(cx, cy, R, cx, cy, R * 1.75);
    g.addColorStop(0, "rgba(255,240,210,0)");
    g.addColorStop(.1, `rgba(255,236,190,${.9 * eclat})`);
    g.addColorStop(.35, `rgba(255,140,120,${.5 * eclat})`);
    g.addColorStop(.7, `rgba(255,94,199,${.15 * eclat})`);
    g.addColorStop(1, "rgba(139,108,255,0)");
    x.fillStyle = g;
    x.beginPath(); x.ellipse(cx, cy, R * 1.75, R * 1.6, incl, 0, 6.283); x.fill();
    // horizon : noir absolu
    x.fillStyle = "#000";
    x.beginPath(); x.arc(cx, cy, R, 0, 6.283); x.fill();
    // anneau de photons
    x.lineWidth = Math.max(1.2, R * .035);
    x.strokeStyle = `rgba(255,248,230,${.95 * eclat})`;
    x.beginPath(); x.arc(cx, cy, R * 1.03, 0, 6.283); x.stroke();
  }
  return { box, dessiner, taille: () => [W, H] };
}

// Bouton Jouer : la page est aspirée par un trou noir, le jeu ressort de l'autre côté
const jouer = document.getElementById("jouer");
let trou = null;
const lisse = t => t * t * (3 - 2 * t);
jouer.addEventListener("click", e => {
  if (trou || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  e.preventDefault();
  const b = jouer.getBoundingClientRect();
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const voile = document.createElement("div");
  voile.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(3,2,8,0)";
  trou = creerTrouNoir();
  voile.appendChild(trou.box);
  document.body.appendChild(voile);
  trou.voile = voile;

  const [W, H] = trou.taille();
  const Rp = Math.min(W, H) * .12;
  const Rmax = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy)) * 1.05;

  // la page est étirée puis avalée en spirale (spaghettification)
  trou.anims = [banner, document.querySelector(".game")].map((el, i) => {
    const r = el.getBoundingClientRect();
    const dx = cx - r.left - r.width / 2, dy = cy - r.top - r.height / 2;
    return el.animate([
      { transform: "none", filter: "blur(0)", opacity: 1 },
      { transform: `translate(${dx * .3}px,${dy * .3}px) rotate(70deg) scale(.85,.55)`, filter: "blur(.5px)", opacity: 1, offset: .45 },
      { transform: `translate(${dx}px,${dy}px) rotate(400deg) scale(.02,.005)`, filter: "blur(5px)", opacity: 0 }
    ], { duration: 1500, delay: 250 + i * 120, easing: "cubic-bezier(.5,0,.85,.4)", fill: "forwards" });
  });

  const t0 = performance.now();
  let avant = t0, parti = false;
  (function boucle(now){
    if (!trou) return;
    const t = now - t0, dt = Math.min((now - avant) / 1000, .05);
    avant = now;
    const ouverture = lisse(Math.min(t / 700, 1));
    const fin = Math.min(Math.max((t - 1700) / 800, 0), 1);
    const R = Rp * ouverture + (Rmax - Rp) * fin * fin * fin;
    trou.dessiner(dt, cx, cy, R, 1 + t / 600, .2 + t / 1200, 1 - fin * fin);
    voile.style.background = `rgba(3,2,8,${.82 * lisse(Math.min(t / 1600, 1)) + .18 * fin})`;
    if (t > 2550 && !parti){ parti = true; location.href = "index.html?portail=1"; }
    requestAnimationFrame(boucle);
  })(t0);
});
// retour arrière : on remet la page en état
addEventListener("pageshow", e => {
  if (!e.persisted || !trou) return;
  trou.voile.remove();
  trou.anims.forEach(a => a.cancel());
  trou = null;
});
</script>
</body>
</html>
