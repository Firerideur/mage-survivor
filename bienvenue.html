<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bienvenue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<meta name="color-scheme" content="dark">
<style>
:root{
  --void:#08060f; --slab:#100c1f; --slab2:#171232; --line:#2a2150;
  --arcane:#8b6cff; --arcane-lt:#c9b6ff; --gold:#ffc94a; --fus:#ff5ec7;
  --ink:#ece7ff; --mut:#8f86b8;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:var(--mono)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:100vh;padding:16px;overflow-x:hidden}

/* La bande */
.banner{
  --mx:50%; --my:50%; --rx:0deg; --ry:0deg;
  position:relative;width:100%;max-width:900px;padding:48px 32px;
  border:1px solid var(--line);border-radius:14px;
  background:
    radial-gradient(420px circle at var(--mx) var(--my), rgba(139,108,255,.28), transparent 60%),
    linear-gradient(135deg,var(--slab),var(--slab2));
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(201,182,255,.04);
  text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .15s ease-out;overflow:hidden;
}
.banner::before{ /* liseré animé */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(90deg,var(--arcane),var(--fus),var(--gold),var(--arcane));
  background-size:300% 100%;animation:flow 6s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.7;pointer-events:none;
}
@keyframes flow{to{background-position:300% 0}}

.name{
  font-size:clamp(2rem,7vw,4.2rem);font-weight:700;letter-spacing:.04em;line-height:1.1;
  display:flex;flex-wrap:wrap;justify-content:center;gap:0 .45em;
}
.name .word{display:inline-flex}
.name span.l{
  display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .25s;
}
.name span.l:hover{transform:translateY(-10px) scale(1.15);color:var(--gold)}
.first{color:var(--arcane-lt)}
.last{color:var(--ink)}

.msg{
  margin-top:20px;font-size:clamp(1rem,2.6vw,1.3rem);color:var(--mut);min-height:1.6em;
}
.msg .caret{display:inline-block;width:.6em;color:var(--fus);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.hint{margin-top:28px;font-size:.75rem;color:var(--mut);opacity:.6;letter-spacing:.1em;text-transform:uppercase}

.spark{
  position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;
  animation:pop .8s ease-out forwards;
}
@keyframes pop{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}

/* Carte du jeu */
.game{
  width:100%;max-width:900px;display:flex;align-items:center;gap:20px;
  padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--slab);
}
.game img{width:88px;height:88px;border-radius:18px;flex-shrink:0;
  box-shadow:0 0 24px rgba(139,108,255,.35)}
.game .info{flex:1;min-width:0}
.game h2{font-size:1.25rem;color:var(--arcane-lt)}
.game p{margin-top:6px;font-size:.9rem;color:var(--mut);line-height:1.45}
.play{
  flex-shrink:0;display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;border-radius:10px;text-decoration:none;
  font:700 1rem var(--mono);letter-spacing:.06em;color:var(--void);
  background:linear-gradient(135deg,var(--gold),var(--fus));
  box-shadow:0 6px 20px rgba(255,94,199,.3);transition:transform .15s,box-shadow .15s;
}
.play:hover,.play:focus-visible{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 28px rgba(255,94,199,.45)}
.play:active{transform:scale(.97)}
@media (max-width:600px){
  .game{flex-direction:column;text-align:center}
  .play{width:100%;justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  .banner{transition:none;transform:none}
  .banner::before,.msg .caret{animation:none}
}
</style>
</head>
<body>

<div class="banner" id="banner" role="button" tabindex="0" aria-label="Bande de bienvenue, cliquer pour changer le message">
  <h1 class="name" id="name"></h1>
  <p class="msg"><span id="msg"></span><span class="caret">▌</span></p>
  <p class="hint">Survole · clique</p>
</div>

<section class="game" aria-labelledby="game-title">
  <img src="icon-192.png" alt="">
  <div class="info">
    <h2 id="game-title">Mage Survivor</h2>
    <p>Mon jeu : un survivor-like magique. Tu ne vises pas, tu construis ton build et tu esquives.</p>
  </div>
  <a class="play" id="jouer" href="index.html">▶ Jouer</a>
</section>

<script>
// ✏️ Modifie ces valeurs avec ton prénom, ton nom et tes messages
const PRENOM = "Loan";
const NOM = "Mourier";
const MESSAGES = [
  "Bienvenue sur ma page !",
  "Ravi de te voir ici ✨",
  "Installe-toi, la magie commence bientôt.",
];

const banner = document.getElementById("banner");
const nameEl = document.getElementById("name");
const msgEl = document.getElementById("msg");

// Nom découpé en lettres pour l'effet au survol
function word(text, cls){
  const w = document.createElement("span");
  w.className = "word " + cls;
  for (const ch of text){
    const s = document.createElement("span");
    s.className = "l";
    s.textContent = ch;
    w.appendChild(s);
  }
  return w;
}
nameEl.append(word(PRENOM, "first"), word(NOM.toUpperCase(), "last"));

// Message tapé lettre par lettre
let msgIndex = 0, typing = null;
function typeMessage(text){
  clearInterval(typing);
  msgEl.textContent = "";
  let i = 0;
  const chars = [...text];
  typing = setInterval(() => {
    msgEl.textContent += chars[i++];
    if (i >= chars.length) clearInterval(typing);
  }, 45);
}
typeMessage(MESSAGES[0]);

// Inclinaison et halo qui suivent le pointeur
banner.addEventListener("pointermove", e => {
  const r = banner.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  banner.style.setProperty("--mx", x * 100 + "%");
  banner.style.setProperty("--my", y * 100 + "%");
  banner.style.setProperty("--ry", (x - .5) * 10 + "deg");
  banner.style.setProperty("--rx", (.5 - y) * 10 + "deg");
});
banner.addEventListener("pointerleave", () => {
  banner.style.setProperty("--rx", "0deg");
  banner.style.setProperty("--ry", "0deg");
});

// Clic : étincelles + message suivant
const colors = ["#8b6cff", "#ff5ec7", "#ffc94a", "#c9b6ff"];
function burst(x, y){
  for (let i = 0; i < 14; i++){
    const s = document.createElement("span");
    s.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d + "px");
    banner.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  }
}
function next(x, y){
  burst(x, y);
  msgIndex = (msgIndex + 1) % MESSAGES.length;
  typeMessage(MESSAGES[msgIndex]);
}
banner.addEventListener("click", e => {
  const r = banner.getBoundingClientRect();
  next(e.clientX - r.left, e.clientY - r.top);
});
banner.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){
    e.preventDefault();
    next(banner.clientWidth / 2, banner.clientHeight / 2);
  }
});

/* Dessin du portail (tourbillon + particules), partagé par l'entrée et la sortie */
const PORTAIL_COULEURS = ["#8b6cff", "#ff5ec7", "#ffc94a", "#c9b6ff"];
function creerPortail(sortie){
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block";
  const x = cv.getContext("2d");
  const parts = [];
  for (let i = 0; i < 160; i++) parts.push({
    a: Math.random() * 6.283, n: sortie ? Math.random() * 2.5 : .2 + Math.random() * 2.6,
    c: PORTAIL_COULEURS[i % 4], s: .8 + Math.random() * 1.8
  });
  let W = 0, H = 0;
  function taille(){
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d;
    x.setTransform(d, 0, 0, d, 0, 0);
  }
  taille();
  addEventListener("resize", taille);
  // t : secondes, (cx, cy) : centre, R : rayon du disque, voile : assombrissement du fond (0..1)
  function dessiner(t, dt, cx, cy, R, voile){
    x.globalCompositeOperation = "source-over";
    x.clearRect(0, 0, W, H);
    if (voile > 0){ x.fillStyle = "rgba(8,6,15," + voile + ")"; x.fillRect(0, 0, W, H); }
    if (R < 1) return;
    const sens = sortie ? -1 : 1;
    // disque : centre noir, bord lumineux, halo
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, R * 1.6);
    g.addColorStop(0, "#000");
    g.addColorStop(.5, "#0b0418");
    g.addColorStop(.6, "rgba(139,108,255,.95)");
    g.addColorStop(.66, "rgba(255,94,199,.6)");
    g.addColorStop(1, "rgba(139,108,255,0)");
    x.fillStyle = g;
    x.beginPath(); x.arc(cx, cy, R * 1.6, 0, 6.283); x.fill();
    x.globalCompositeOperation = "lighter";
    // bras de la spirale
    const bras = 7;
    for (let k = 0; k < bras; k++){
      x.beginPath();
      for (let i = 0; i <= 40; i++){
        const f = i / 40, r = R * 1.02 * (1 - f);
        const a = k * 6.283 / bras + sens * t * 2.4 + f * 4.8 * sens;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.strokeStyle = PORTAIL_COULEURS[k % 4];
      x.globalAlpha = .35;
      x.lineWidth = 2 + R * .025;
      x.stroke();
    }
    // particules aspirées (entrée) ou projetées (sortie)
    for (const p of parts){
      const r0 = p.n * R, a0 = p.a;
      if (sortie){
        p.n *= 1 + dt * 1.8; p.a -= dt * (1.2 + 1.6 / (p.n + .15));
        if (p.n > 2.6){ p.n = .05 + Math.random() * .2; p.a = Math.random() * 6.283; continue; }
      } else {
        p.n *= 1 - dt * 1.8; p.a += dt * (1.2 + 1.6 / (p.n + .15));
        if (p.n < .04){ p.n = 1.4 + Math.random() * 1.4; p.a = Math.random() * 6.283; continue; }
      }
      const r1 = p.n * R;
      x.globalAlpha = Math.min(1, .3 + (sortie ? p.n : 1.6 - p.n * .5));
      x.strokeStyle = p.c; x.lineWidth = p.s;
      x.beginPath();
      x.moveTo(cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0);
      x.lineTo(cx + Math.cos(p.a) * r1, cy + Math.sin(p.a) * r1);
      x.stroke();
    }
    x.globalAlpha = 1;
  }
  return { cv, dessiner, taille: () => [W, H] };
}

// Bouton Jouer : aspiré dans le portail, puis le jeu s'ouvre de l'autre côté
const jouer = document.getElementById("jouer");
let portail = null;
const facile = t => 1 - Math.pow(1 - t, 3);
const rebond = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
jouer.addEventListener("click", e => {
  if (portail || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  e.preventDefault();
  const b = jouer.getBoundingClientRect();
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const voile = document.createElement("div");
  voile.style.cssText = "position:fixed;inset:0;z-index:9999";
  portail = creerPortail(false);
  voile.appendChild(portail.cv);
  document.body.appendChild(voile);
  portail.voile = voile;

  const [W, H] = portail.taille();
  const Rp = Math.min(W, H) * .2;
  const Rmax = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy)) / .78;

  // la page tourbillonne et rétrécit vers le portail
  setTimeout(() => {
    for (const el of [banner, document.querySelector(".game")]){
      const r = el.getBoundingClientRect();
      el.style.transition = "transform 1.1s cubic-bezier(.6,0,.9,.5), filter 1.1s, opacity 1.1s";
      el.style.transform = `translate(${cx - r.left - r.width / 2}px,${cy - r.top - r.height / 2}px) rotate(540deg) scale(0)`;
      el.style.filter = "blur(4px)";
      el.style.opacity = ".3";
    }
  }, 350);

  const t0 = performance.now();
  let avant = t0, parti = false;
  (function boucle(now){
    if (!portail) return;
    const t = now - t0, dt = Math.min((now - avant) / 1000, .05);
    avant = now;
    let R;
    if (t < 450) R = Rp * rebond(t / 450);
    else if (t < 1500) R = Rp * (1 + .06 * Math.sin((t - 450) / 90));
    else R = Rp + (Rmax - Rp) * Math.pow(Math.min((t - 1500) / 650, 1), 2.2);
    portail.dessiner(t / 1000, dt, cx, cy, R, .7 * facile(Math.min(t / 1500, 1)));
    if (t > 2150 && !parti){ parti = true; location.href = "index.html?portail=1"; }
    requestAnimationFrame(boucle);
  })(t0);
});
// retour arrière : on remet la page en état
addEventListener("pageshow", e => {
  if (!e.persisted || !portail) return;
  portail.voile.remove();
  portail = null;
  for (const el of [banner, document.querySelector(".game")])
    el.style.transition = el.style.transform = el.style.filter = el.style.opacity = "";
});
</script>
</body>
</html>
