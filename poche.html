<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1b4a">
<title>Aventure de Poche — 151 héros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--shell:#5b3fb8;--shell2:#3f2a8a;--shell3:#7a5ad8;--ink:#1a1030;--btn:#c0285a;--btn2:#8a1640}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;background:#140c26;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',ui-monospace,monospace;color:#f8f8f8}
/* la console */
#gbc{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 10px 22px;
  background:linear-gradient(160deg,var(--shell3),var(--shell) 40%,var(--shell2));border-radius:16px 16px 56px 16px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.25),0 18px 50px rgba(0,0,0,.6)}
#bezel{position:relative;padding:12px 12px 8px;background:#2a2440;border-radius:10px 10px 30px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#bezel .led{position:absolute;left:8px;top:44%;width:7px;height:7px;border-radius:50%;background:#ff3050;box-shadow:0 0 8px #ff3050}
#bezel .brand{text-align:center;font-size:8px;color:#b8b0d8;margin-top:8px;letter-spacing:.08em}
#bezel .brand b{color:#ff5a7a}#bezel .brand i{font-style:normal;color:#5ad0ff}#bezel .brand u{text-decoration:none;color:#ffd84a}
#screen{position:relative;background:#000;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* commandes */
#pad{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px}
#dpad{position:relative;width:124px;height:124px;touch-action:none}
#dpad i{position:absolute;background:#26203a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.1)}
#dpad .h{left:0;right:0;top:41px;height:42px;border-radius:7px}#dpad .v{top:0;bottom:0;left:41px;width:42px;border-radius:7px}
#dpad .c{left:52px;top:52px;width:20px;height:20px;border-radius:50%;background:#1c1830;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
#dpad b{position:absolute;color:#6a6290;font-size:9px}
#ab{position:relative;width:132px;height:104px;transform:rotate(-22deg)}
.bt{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8507a,var(--btn) 55%,var(--btn2));
  box-shadow:0 4px 0 #5a0c28,0 6px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:12px;color:#ffd0dc}
.bt.on,.sm.on{transform:translateY(3px);box-shadow:0 1px 0 #5a0c28}
#bA{right:0;top:6px}#bB{left:6px;top:42px}
.bt span{transform:rotate(22deg)}
#small{display:flex;gap:26px}
.sm{width:58px;height:16px;border-radius:9px;background:#26203a;box-shadow:0 3px 0 rgba(0,0,0,.45);transform:rotate(-22deg)}
.lbl{display:flex;gap:26px;font-size:7px;color:#b8b0d8;margin-top:-10px}.lbl span{width:58px;text-align:center}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:7px;color:#6a6290;line-height:1.8}
@media (hover:none){#hint{display:none}}

html,body{touch-action:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}

#ui{position:absolute;left:0;top:0;width:160px;height:144px;transform-origin:0 0;font-size:7px;line-height:1;color:#202028;pointer-events:none;overflow:hidden}
#ui>*{pointer-events:auto}
#ui .box,#ui .menu,#ui .hp,#ui .lvbox,#ui .minfo,#ui .phint,#ui .bdesc,#ui .qty,#ui .money,#ui .dexh{position:absolute;background:#f8f8f8;border:2px solid #303060;box-shadow:inset 0 0 0 1px #f8f8f8,inset 0 0 0 2px #9898d0;border-radius:2px}
#ui .box{left:0;right:0;bottom:0;height:46px;padding:9px 7px;line-height:14px;white-space:pre-wrap;z-index:5}
#ui .more{position:absolute;right:6px;bottom:5px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#ui .menu{right:0;top:0;padding:6px 6px 4px 13px;line-height:13px;z-index:6;white-space:nowrap}
#ui .menu>div{position:relative;cursor:pointer}
#ui .menu>div.sel::before{content:'▶';position:absolute;left:-9px;top:0}
#ui .menu>div.dis{color:#a0a0a8}
#ui .menu.yn{top:auto;bottom:46px}
#ui .menu.title{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:10px}
#ui .menu.bmenu{left:0;right:0;top:auto;bottom:0;height:46px;display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:10px 6px 6px 18px}
#ui .menu.mmenu{left:0;right:0;top:auto;bottom:0;height:56px;font-size:6px;line-height:11px;padding:5px 4px 4px 12px;overflow:hidden}
#ui .menu.mmenu.forget{bottom:46px;height:auto}
#ui .minfo{right:0;bottom:56px;width:72px;padding:4px 5px;font-size:6px;line-height:9px;z-index:7}
#ui .menu.sub{top:auto;bottom:0}
#ui .hp{padding:4px 5px;font-size:6px;line-height:8px;z-index:1}
#ui .hp.foe{left:3px;top:4px;width:86px}
#ui .hp.me{right:3px;top:56px;width:84px}
#ui .hp .lv{position:absolute;right:5px;top:4px}
#ui .hp .pv{display:flex;align-items:center;gap:2px;font-size:5px;margin-top:2px}
#ui .hp .num{text-align:right;margin-top:1px}
#ui .xp{height:2px;background:#d0d0e0;margin-top:2px}#ui .xp i{display:block;height:100%;background:#3878e8}
#ui .bar{display:inline-block;width:52px;height:4px;border:1px solid #303030;background:#505050;border-radius:2px;overflow:hidden;vertical-align:middle}
#ui .bar i{display:block;height:100%}
#ui .st{color:#fff;background:#c03050;padding:0 1px}
#ui .cg{color:#e03030;font-weight:normal}
#ui .lvbox{right:0;top:0;width:88px;padding:5px 6px;font-size:6px;line-height:11px;z-index:6}
#ui .lvbox span,#ui .bag span,#ui .sb span,#ui .qty span{float:right}
#ui .panel{position:absolute;inset:0;background:#f8f8f8;z-index:2}
#ui .party-bg,#ui .bag-bg,#ui .dex-bg{background:#e8e8f0}
#ui .menu.party{left:0;right:0;top:0;bottom:28px;border:none;box-shadow:none;background:transparent;padding:3px 3px 0 11px;font-size:6px;line-height:8px;z-index:3;overflow:hidden}
#ui .menu.party>div{display:grid;grid-template-columns:17px 1fr 24px;grid-template-rows:9px 8px;align-items:center;height:18px;column-gap:2px}
#ui .menu.party>div.sel{background:#d8e0f8}
#ui .menu.party>div.sel::before{top:5px}
#ui .menu.party img{grid-row:1/3;width:16px;height:16px;image-rendering:pixelated}
#ui .menu.party .hpb{grid-column:2}#ui .menu.party .ph{grid-column:3;font-size:5px}
#ui .menu.party.box{overflow:auto}#ui .menu.party.box>div{grid-template-rows:16px}
#ui .phint{left:0;right:0;bottom:0;height:28px;padding:9px 7px;z-index:3}
#ui .menu.bag{left:6px;right:6px;top:4px;bottom:34px;font-size:6px;line-height:12px;overflow:auto;z-index:3}
#ui .bdesc{left:0;right:0;bottom:0;height:34px;padding:6px;font-size:6px;line-height:10px;z-index:3}
#ui .summary,#ui .dexe{font-size:6px;line-height:10px;padding:4px}
#ui .big{position:absolute;left:4px;top:4px;width:56px;height:56px;image-rendering:pixelated;background:#e8e8f0;border:1px solid #c0c0d0}
#ui .sh{position:absolute;left:66px;top:6px;right:4px;line-height:11px}
#ui .ty{display:inline-block;color:#fff;padding:1px 2px;margin:1px 2px 0 0;font-size:5px;line-height:7px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
#ui .sb{position:absolute;left:4px;right:4px;top:63px;line-height:8.5px}
#ui .ser{color:#6060a0;font-size:5px;line-height:7px}
#ui .sb.mv>div{margin-bottom:3px}#ui .sb.mv i{display:block;font-style:normal;color:#707088;font-size:5px;padding-left:20px}
#ui .pg{position:absolute;right:5px;bottom:3px;font-size:5px;color:#707088}
#ui .dt{position:absolute;left:5px;right:5px;top:66px;line-height:11px}
#ui .dexh{left:0;right:0;top:0;height:14px;padding:3px 6px;font-size:6px;z-index:3}
#ui .menu.dex{left:4px;right:4px;top:16px;bottom:2px;font-size:6px;line-height:11px;overflow:auto;z-index:3}
#ui .menu.dex b{display:inline-block;width:7px}
#ui .card{padding:10px;line-height:15px;font-size:7px}
#ui .card .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}#ui .card .badges i{width:12px;height:12px;border-radius:50%;border:1px solid #303060}
#ui .card .ch{color:#c08000;margin-top:6px}
#ui .qty{right:0;bottom:46px;padding:6px;width:90px;z-index:7}
@media (orientation:landscape) and (max-height:600px){
 #gbc{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;grid-template-areas:"dpad bezel ab" "sel bezel start";align-items:center;justify-items:center;
   width:100vw;height:100vh;height:100dvh;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-radius:0;gap:4px 12px}
 #pad,#small{display:contents}
 #dpad{grid-area:dpad}#ab{grid-area:ab}#bSel{grid-area:sel}#bStart{grid-area:start}
 .lbl{display:none}
 #bezel{grid-area:bezel;padding:8px 10px}#bezel .brand{display:none}#bezel .led{left:3px}
 .sm{transform:none;position:relative;margin-bottom:12px}
 .sm::after{content:attr(data-l);position:absolute;top:21px;left:-10px;right:-10px;text-align:center;font-size:7px;color:#b8b0d8}
 #hint{display:none}
}
#ui .money{left:0;top:0;padding:5px 6px;line-height:10px;font-size:6px;z-index:4}
</style>
</head>
<body>
<div id="gbc">
  <div id="bezel"><span class="led"></span>
    <div id="screen"><canvas id="cv" width="160" height="144"></canvas>
      <div id="ui"></div></div>
    <div class="brand"><b>AVENTURE</b> <i>DE</i> <u>POCHE</u></div>
  </div>
  <div id="pad">
    <div id="dpad"><i class="h"></i><i class="v"></i><i class="c"></i></div>
    <div id="ab"><div class="bt" id="bB"><span>B</span></div><div class="bt" id="bA"><span>A</span></div></div>
  </div>
  <div id="small"><div class="sm" id="bSel" data-l="SELECT"></div><div class="sm" id="bStart" data-l="START"></div></div>
  <div class="lbl"><span>SELECT</span><span>START</span></div>
</div>
<div id="hint">Flèches / ZQSD : marcher · X (maintenu) : courir · Espace / W : A · Entrée : START</div>
<script src="poche/data.js?v=2"></script>
<script src="poche/content.js?v=2"></script>
<script src="poche/sprites.js?v=2"></script>
<script src="poche/core.js?v=2"></script>
<script src="poche/world.js?v=2"></script>
<script src="poche/game.js?v=2"></script>
<script src="poche/battle.js?v=2"></script>
<script src="poche/menus.js?v=2"></script>
<script src="poche/main.js?v=2"></script>
</body>
</html>
