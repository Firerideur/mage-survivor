<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1b4a">
<title>Aventure de Poche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--shell:#5b3fb8;--shell2:#3f2a8a;--shell3:#7a5ad8;--ink:#1a1030;--btn:#c0285a;--btn2:#8a1640}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;background:#140c26;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',ui-monospace,monospace;color:#f8f8f8}
/* la console */
#gbc{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 10px 22px;
  background:linear-gradient(160deg,var(--shell3),var(--shell) 40%,var(--shell2));border-radius:16px 16px 56px 16px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.25),0 18px 50px rgba(0,0,0,.6)}
#bezel{position:relative;padding:12px 12px 8px;background:#2a2440;border-radius:10px 10px 30px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#bezel .led{position:absolute;left:8px;top:44%;width:7px;height:7px;border-radius:50%;background:#ff3050;box-shadow:0 0 8px #ff3050}
#bezel .brand{text-align:center;font-size:8px;color:#b8b0d8;margin-top:8px;letter-spacing:.08em}
#bezel .brand b{color:#ff5a7a}#bezel .brand i{font-style:normal;color:#5ad0ff}#bezel .brand u{text-decoration:none;color:#ffd84a}
#screen{position:relative;background:#000;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* boîte de dialogue façon GBC */
#box{position:absolute;left:0;right:0;bottom:0;display:none;background:#f8f8f8;color:#202020;
  border:calc(var(--s)*2px) solid #303060;box-shadow:inset 0 0 0 calc(var(--s)*1px) #f8f8f8,inset 0 0 0 calc(var(--s)*2px) #8888c8;
  padding:calc(var(--s)*5px) calc(var(--s)*7px);font-size:calc(var(--s)*7px);line-height:1.75;height:calc(var(--s)*48px);white-space:pre-wrap}
#box .more{position:absolute;right:calc(var(--s)*6px);bottom:calc(var(--s)*4px);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#menu{position:absolute;right:0;top:0;display:none;background:#f8f8f8;color:#202020;border:calc(var(--s)*2px) solid #303060;
  box-shadow:inset 0 0 0 calc(var(--s)*1px) #f8f8f8,inset 0 0 0 calc(var(--s)*2px) #8888c8;padding:calc(var(--s)*5px) calc(var(--s)*5px) calc(var(--s)*5px) calc(var(--s)*10px);
  font-size:calc(var(--s)*7px);line-height:2.1}
#menu div{position:relative}#menu div.sel::before{content:'▶';position:absolute;left:calc(var(--s)*-8px)}
#flash{position:absolute;inset:0;background:#f8f8f8;opacity:0;pointer-events:none}
/* commandes */
#pad{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px}
#dpad{position:relative;width:124px;height:124px;touch-action:none}
#dpad i{position:absolute;background:#26203a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.1)}
#dpad .h{left:0;right:0;top:41px;height:42px;border-radius:7px}#dpad .v{top:0;bottom:0;left:41px;width:42px;border-radius:7px}
#dpad .c{left:52px;top:52px;width:20px;height:20px;border-radius:50%;background:#1c1830;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
#dpad b{position:absolute;color:#6a6290;font-size:9px}
#ab{position:relative;width:132px;height:104px;transform:rotate(-22deg)}
.bt{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8507a,var(--btn) 55%,var(--btn2));
  box-shadow:0 4px 0 #5a0c28,0 6px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:12px;color:#ffd0dc}
.bt.on,.sm.on{transform:translateY(3px);box-shadow:0 1px 0 #5a0c28}
#bA{right:0;top:6px}#bB{left:6px;top:42px}
.bt span{transform:rotate(22deg)}
#small{display:flex;gap:26px}
.sm{width:58px;height:16px;border-radius:9px;background:#26203a;box-shadow:0 3px 0 rgba(0,0,0,.45);transform:rotate(-22deg)}
.lbl{display:flex;gap:26px;font-size:7px;color:#b8b0d8;margin-top:-10px}.lbl span{width:58px;text-align:center}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:7px;color:#6a6290;line-height:1.8}
@media (hover:none){#hint{display:none}}
</style>
</head>
<body>
<div id="gbc">
  <div id="bezel"><span class="led"></span>
    <div id="screen"><canvas id="cv" width="160" height="144"></canvas>
      <div id="box"></div><div id="menu"></div><div id="flash"></div></div>
    <div class="brand"><b>AVENTURE</b> <i>DE</i> <u>POCHE</u></div>

  <div id="pad">

</div>
<div id="hint">Flèches / ZQSD : marcher · X (maintenu) : courir · Espace / W : A · Entrée : START</div>
<script>
'use strict';
const MAP_OUT=["TTTTTTTTTTT==TTTTTTTTTTT", "TTTTTTTTTTT==TTTTTTTTTTT", "TT:::::....==S....:::TTT", "TT:::::....==.....:::TTT", "TT:::::.....==....:::TTT", "TT..........==.......TTT", "TTvvvvvvvv..==..vvvvvTTT", "TT..........==.......TTT", "TT...TT.....==..:::::TTT", "TT...TT.....==..:::::TTT", "TT::::......==..:::::TTT", "TT::::..r...==.......TTT", "TTvvvvvvvvv.==.vvvvvvTTT", "TT..........==.......TTT", "TT.f.f......==.....f.TTT", "TTTTTTTTTT..==..TTTTTTTT", "TT.........====.......TT", "TT..f.f...==..==..f.f.TT", "TT..BBBBB.=....=BBBBB.TT", "TT..BBBBB.=....=BBBBB.TT", "TT..BBBBB.=....=BBBBB.TT", "TT..BBDBB.=....=BBDBB.TT", "TT..M.=...=....=..=M..TT", "TT....=====S===.==....TT", "TT.......=....=.......TT", "TT.f.f...=....=...f.f.TT", "TT.....BBBBBBBB.......TT", "TT.....BBBBBBBB....r..TT", "TT.....BBBBBBBB.......TT", "TT.....BBBBBBBB..ffff.TT", "TT.....BBBDBBBB..ffff.TT", "TT~~~~...=.=..........TT", "TT~~~~~..===....S.....TT", "TT~~~~~~..............TT", "TT~~~~~~~~#####.#####.TT", "TTTTTTTTTTTTTTTTTTTTTTTT"];
const MAP_HOUSE=["wwwwwwwwww", "wwwwwwwwww", "KK..tv..BB", "KK........", "...cc.....", "..........", "..........", "....mm...."];

/* =========================================================================
   AVENTURE DE POCHE — un jeu original façon « anciens jeux de monstres
   de poche » en couleur. Écran 160×144, tuiles de 16 px, déplacement case
   par case. Tout le pixel art est dessiné ici, dans le code.
   ========================================================================= */
const W=160, H=144, TS=16;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

/* --- palette (tons Game Boy Color) ----------------------------------- */
const PAL={k:'#202028',g:'#70c850',G:'#3c9030',l:'#b0e878',d:'#e8d098',D:'#c8a868',
  w:'#4890f0',W:'#2860c0',x:'#b8e0ff',t:'#3c9a3c',T:'#21622a',L:'#6cc458',b:'#8b5a2b',B:'#5c3a1c',
  r:'#e05040',R:'#a02828',e:'#f8ecd0',E:'#c8b090',f:'#f8f8f8',y:'#f8d038',p:'#f87898',o:'#f09030',
  s:'#f8c8a0',S:'#d89870',c:'#30a0e0',C:'#1868a8',h:'#4a2c18',j:'#f08838',J:'#c06018',n:'#3858b0',N:'#203878',m:'#383838',
  z:'#b0b0b8',Z:'#70707c',u:'#5888e0',U:'#2f58a8',v:'#90d0f8',q:'#e8b070',Q:'#b88040',a:'#d03848',A:'#8a1c30'};
function art(rows,pal){ const c=document.createElement('canvas'); c.width=rows[0].length; c.height=rows.length; const g=c.getContext('2d');
  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const k=r[x]; if(k==='.'||k===' ') continue; g.fillStyle=(pal||PAL)[k]||k; g.fillRect(x,y,1,1); } }); return c; }
function tile(fn){ const c=document.createElement('canvas'); c.width=c.height=TS; const g=c.getContext('2d'); fn(g,(x,y,col)=>{ g.fillStyle=PAL[col]||col; g.fillRect(x,y,1,1); }); return c; }
const flip=src=>{ const c=document.createElement('canvas'); c.width=src.width; c.height=src.height; const g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; };
let seed=1; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* --- tuiles ----------------------------------------------------------- */
function grassTile(v){ seed=7+v*13; return tile((g,px)=>{ g.fillStyle=PAL.g; g.fillRect(0,0,16,16);
  for(let i=0;i<5+v*2;i++){ const x=Math.floor(rnd()*14)+1, y=Math.floor(rnd()*13)+2; px(x,y,'G'); px(x-1,y+1,'G'); px(x+1,y+1,'G'); if(rnd()<.5) px(x,y-1,'l'); } }); }
const GRASS=[grassTile(0),grassTile(1),grassTile(2)];
const TUFT=['...l....','..lGl...','.lGgGl.l','.GgGgGlG','lGgGgGGg','GgGgGgGg','gGgGgGgG','GGGGGGGG'];
const TALL=tile(g=>{ g.fillStyle='#58b038'; g.fillRect(0,0,16,16); const t=art(TUFT,Object.assign({},PAL,{g:'#58b038',G:'#2c7a24',l:'#c0f080'}));
  for(const [x,y] of [[0,0],[8,0],[-4,8],[4,8],[12,8]]) g.drawImage(t,x,y); });
const PATH=tile((g,px)=>{ g.fillStyle=PAL.d; g.fillRect(0,0,16,16); seed=99; for(let i=0;i<7;i++) px(Math.floor(rnd()*16),Math.floor(rnd()*16),'D'); });
function flowerTile(f){ return tile((g,px)=>{ g.drawImage(GRASS[0],0,0);
  for(const [cx,cy,col] of [[4,4,'p'],[12,11,'y']]){ const o=f?1:0;
    px(cx,cy-1-o+o,col); px(cx-1,cy,col); px(cx+1,cy,col); px(cx,cy+1,col); px(cx,cy,f?'f':'o');
    if(f){ px(cx-1,cy-1,col); px(cx+1,cy+1,col); } px(cx,cy+2,'G'); px(cx,cy+3,'G'); } }); }
const FLOWER=[flowerTile(0),flowerTile(1)];
function waterTile(f){ return tile((g,px)=>{ g.fillStyle=PAL.w; g.fillRect(0,0,16,16);
  for(let y=2;y<16;y+=5) for(let x=0;x<16;x++){ const yy=y+Math.round(Math.sin((x+f*4)/16*Math.PI*2)*1.2); if((x+y+f*3)%8<3) px(x,yy,'x'); else if((x+y)%8===5) px(x,yy+1,'W'); } }); }
const WATER=[waterTile(0),waterTile(1),waterTile(2)];
const TREE=art([
'....kkkkkkkk....','..kkLLLLLLttkk..','.kLLLLLLttttttk.','.kLLLLtttttttTk.','kLLLttttttttTTTk','kLLtttLLtttTTTTk',
'kLttttLLttTTTTTk','kttttttttTTTTTTk','kttLLtttTTTLTTTk','.kttttttTTTTTTk.','.kTttttTTTTTTTk.','..kkTTTTTTTTkk..',
'....kkkbbkkk....','......kbbk......','......kBbk......','.......kk.......']);
const LEDGE=tile((g,px)=>{ g.drawImage(GRASS[1],0,0); g.fillStyle=PAL.G; g.fillRect(0,9,16,5); g.fillStyle=PAL.l; g.fillRect(0,9,16,1);
  g.fillStyle=PAL.k; g.fillRect(0,14,16,1); for(let x=1;x<16;x+=4) px(x,11,'T'); });
const FENCE=tile((g,px)=>{ g.drawImage(GRASS[0],0,0); g.fillStyle=PAL.k; g.fillRect(0,5,16,1); g.fillRect(0,10,16,1);
  g.fillStyle=PAL.f; g.fillRect(0,6,16,1); g.fillRect(0,11,16,1); for(const x of [2,10]){ g.fillStyle=PAL.k; g.fillRect(x-1,2,5,12); g.fillStyle=PAL.f; g.fillRect(x,3,3,10); g.fillStyle=PAL.z; g.fillRect(x+2,3,1,10); } });
const SIGN=tile((g)=>{ g.drawImage(GRASS[2],0,0); g.drawImage(art(['.kkkkkkkkkkkkk..','kqqqqqqqqqqqqqk.','kqQQQQQQQQQQqqk.','kqqqqqqqqqqqqqk.','kqQQQQQQQQqqqqk.','kqqqqqqqqqqqqqk.',
  '.kkkkkkkkkkkkk..','......kbbk......','......kbbk......','......kbbk......','.....kkkkkk.....']),1,3); });
const MAILBOX=tile(g=>{ g.drawImage(GRASS[0],0,0); g.drawImage(art(['..kkkkkkkkk.....','.kaaaaaaaaak....','kaaaaaaaaaaak.k.','kaAAAAAAAAAakkyk','kaaaaaaaaaaak.k.','kAAAAAAAAAAAk...',
  '.kkkkkkkkkkk....','.....kbbk.......','.....kbbk.......','.....kbbk.......','....kkkkkk......']),2,3); });
const ROCK=tile(g=>{ g.drawImage(GRASS[1],0,0); g.drawImage(art(['....kkkkkkk.....','..kkzzzzzzzkk...','.kzzffzzzzzzZk..','.kzfzzzzzzzZZk..','kzzzzzzzzzZZZZk.','kzzzzzzzzZZZZZk.',
  'kZzzzzzzZZZZZZk.','kZZZZZZZZZZZZZk.','.kZZZZZZZZZZZk..','..kkkkkkkkkkk...']),1,4); });
/* intérieur */
const FLOOR=tile((g,px)=>{ g.fillStyle=PAL.q; g.fillRect(0,0,16,16); g.fillStyle=PAL.Q; for(let y=3;y<16;y+=4) g.fillRect(0,y,16,1); for(let y=0;y<16;y+=4) px((y*5)%16,y+1,'Q'); });
const WALL=tile((g)=>{ g.fillStyle='#f0e0c8'; g.fillRect(0,0,16,16); g.fillStyle='#d8c0a0'; for(let x=1;x<16;x+=4) g.fillRect(x,0,1,13); g.fillStyle='#a07850'; g.fillRect(0,13,16,3); });
const WALLTOP=tile(g=>{ g.fillStyle='#f0e0c8'; g.fillRect(0,0,16,16); g.fillStyle='#d8c0a0'; for(let x=1;x<16;x+=4) g.fillRect(x,0,1,16); });
const WINDOW=tile(g=>{ g.drawImage(WALL,0,0); g.drawImage(art(['kkkkkkkkkk','kvvvvkvvvk','kvfvvkvvvk','kvvvvkvvvk','kkkkkkkkkk','kvvvvkvvvk','kvvvvkvvvk','kkkkkkkkkk']),3,2); });
const MAT=tile(g=>{ g.drawImage(FLOOR,0,0); g.fillStyle=PAL.a; g.fillRect(1,3,14,10); g.fillStyle=PAL.A; g.fillRect(1,3,14,1); g.fillRect(1,12,14,1); g.fillStyle=PAL.y; for(let x=3;x<14;x+=3) g.fillRect(x,7,1,2); });
const SHELF=art(['kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk','kBrrCCyypprrjjCCyyrrnnppCCrryyBk','kBrrCCyypprrjjCCyyrrnnppCCrryyBk','kBrrCCyypprrjjCCyyrrnnppCCrryyBk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk',
  'kBnnyyrrCCppjjrryynnCCpprryyjjBk','kBnnyyrrCCppjjrryynnCCpprryyjjBk','kBnnyyrrCCppjjrryynnCCpprryyjjBk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk','kBbbbbbbbbbbbbbbbbbbbbbbbbbbbbBk','kBbbbbbbbbbbbbbbbbbbbbbbbbbbbbBk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk',
  'kBbbbbbbbbbbbbbbbbbbbbbbbbbbbbBk','kBbbbbbbbbbbbbbbbbbbbbbbbbbbbbBk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk','kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk']);
const TV=art(['................','..kkkkkkkkkkkk..','.kZZZZZZZZZZZZk.','.kZkkkkkkkkkkZk.','.kZkvvvvvvvvkZk.','.kZkvfvvvvvvkZk.','.kZkvvvvvvvvkZk.','.kZkvvvvvvvvkZk.','.kZkkkkkkkkkkZk.',
  '.kZZZZZZZZZyZZk.','.kkkkkkkkkkkkkk.','.kBBBBBBBBBBBBk.','.kBbbbbbbbbbbBk.','.kBkkkkkkkkkkBk.','.kBk........kBk.','.kkk........kkk.']);
const PLANT=art(['......tLt.......','...tLttLttLt....','..tLLtTLtLLtt...','...tTtLLtTtLt...','..tLttTttLtTt...','...ttLtTtLtt....','....tTtLttT.....','.....kkkkkk.....',
  '....kaaaaaak....','....kAaaaaAk....','....kAaaaaAk....','.....kAaaAk.....','.....kAAAAk.....','......kkkk......','................','................']);
const BED=art(['kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk','kBffffffffffffffffffBBBBBBBBBBBk','kBfzzzzzzzzzzzzzzzzfBccccccccccBk','kBffffffffffffffffffBcCcccccccccBk','kBBBBBBBBBBBBBBBBBBBBcccccccCcccBk',
  'kBbbbbbbbbbbbbbbbbbbBccCcccccccBk','kBbbbbbbbbbbbbbbbbbbBcccccccccCBk','kBbbbbbbbbbbbbbbbbbbBccccCcccccBk','kBbbbbbbbbbbbbbbbbbbBcccccccccccBk','kBbbbbbbbbbbbbbbbbbbBcCcccccCcccBk','kBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBk',
  'kbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbk','kBk..........................kBk','kBk..........................kBk','kkk..........................kkk'].map(r=>r.slice(0,32)));
const TABLE=art(['................................','..kkkkkkkkkkkkkkkkkkkkkkkkkkkk..','.kqqqqqqqqqqqqqqqqqqqqqqqqqqqqk.','.kqfffffqqqqqqqqqqqqqqqqffffqqk.','.kqfvvvfqqqqqqqqqqqqqqqqfyyfqqk.','.kqfffffqqqqqqqqqqqqqqqqffffqqk.',
  '.kqqqqqqqqqqqqqqqqqqqqqqqqqqqqk.','.kQQQQQQQQQQQQQQQQQQQQQQQQQQQQk.','.kkkkkkkkkkkkkkkkkkkkkkkkkkkkkk.','..kBk....................kBk..','..kBk....................kBk..','..kBk....................kBk..','..kBk....................kBk..','..kkk....................kkk..']);

/* --- bâtiments (dessinés d'un bloc) ----------------------------------- */
function building(w,h,roof,roof2,doorCol,lab){ const c=document.createElement('canvas'); c.width=w*16; c.height=h*16; const g=c.getContext('2d'), W=c.width, Hh=c.height;
  const roofH=lab?36:34;
  /* toit */
  g.fillStyle=PAL.k; g.fillRect(2,0,W-4,roofH+2); g.fillStyle=roof; g.fillRect(3,1,W-6,roofH);
  g.fillStyle=roof2; for(let y=6;y<roofH;y+=6){ g.fillRect(3,y,W-6,1); for(let x=3+((y/6)%2)*4;x<W-3;x+=8) g.fillRect(x,y-5,1,5); }
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(3,1,W-6,2);
  g.fillStyle=PAL.k; g.fillRect(0,roofH-1,W,3); g.fillStyle=roof2; g.fillRect(1,roofH,W-2,1);
  if(!lab){ g.fillStyle=PAL.k; g.fillRect(W-22,0,10,12); g.fillStyle=PAL.Z; g.fillRect(W-21,1,8,10); g.fillStyle=PAL.z; g.fillRect(W-21,1,8,2); }
  /* murs */
  g.fillStyle=PAL.k; g.fillRect(2,roofH+2,W-4,Hh-roofH-2); g.fillStyle=lab?'#f8f8f8':PAL.e; g.fillRect(3,roofH+2,W-6,Hh-roofH-3);
  g.fillStyle=lab?'#d8d8e8':PAL.E; g.fillRect(3,Hh-4,W-6,3);
  /* fenêtres */
  const win=(x)=>{ g.fillStyle=PAL.k; g.fillRect(x,roofH+6,14,11); g.fillStyle=PAL.v; g.fillRect(x+1,roofH+7,12,9); g.fillStyle=PAL.f; g.fillRect(x+2,roofH+8,3,2);
    g.fillStyle=PAL.k; g.fillRect(x+7,roofH+7,1,9); g.fillRect(x+1,roofH+11,12,1); };
  for(let i=0;i<w;i++){ if(i===doorCol) continue; if(lab||i===0||i===w-1) win(i*16+1); }
  /* porte */
  const dx=doorCol*16+2; g.fillStyle=PAL.k; g.fillRect(dx,Hh-19,12,18); g.fillStyle=PAL.b; g.fillRect(dx+1,Hh-18,10,17); g.fillStyle=PAL.B; g.fillRect(dx+1,Hh-18,10,2); g.fillRect(dx+5,Hh-16,1,15);
  g.fillStyle=PAL.y; g.fillRect(dx+8,Hh-10,1,2);
  return c; }
const BUILD=[
  {x:4,y:18,w:5,h:4,door:2,img:building(5,4,PAL.r,PAL.R,2,false),kind:'maison'},
  {x:16,y:18,w:5,h:4,door:2,img:building(5,4,'#58b0a0','#2f7a6a',2,false),kind:'voisin'},
  {x:7,y:26,w:8,h:5,door:3,img:building(8,5,PAL.u,PAL.U,3,true),kind:'labo'}];

/* --- dresseur (16×16, 4 directions) ----------------------------------- */

const AU={ac:null,on:true,init(){ if(this.ac) return; try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  beep(f,d,type,vol,slide){ if(!this.ac||!this.on) return; const o=this.ac.createOscillator(), g=this.ac.createGain(), t=this.ac.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t+d); },
  bump(){ this.beep(90,.12,'square',.06,60); }, ok(){ this.beep(1320,.06,'square',.04); }, door(){ this.beep(300,.25,'triangle',.08,900); },
  jump(){ this.beep(500,.2,'square',.04,1200); }, grass(){ this.beep(2400,.03,'triangle',.015,1800); }};

  [72,1],[76,1],[79,2],[81,1],[79,1],[77,2],[76,1],[74,1],[72,1],[74,1],[72,4]],
  bass:[48,48,55,55,53,53,55,55,48,48,55,55,53,55,48,48],
  tick(dt){ if(!AU.ac||!this.on||!AU.on) return; this.t-=dt; if(this.t>0) return;
    const [n,len]=this.notes[this.i%this.notes.length], beat=.19, f=440*Math.pow(2,(n-69)/12);
    AU.beep(f,len*beat*.9,'square',.018); if(this.i%2===0){ const b=this.bass[(this.i>>1)%this.bass.length]; AU.beep(440*Math.pow(2,(b-69)/12),beat*1.8,'triangle',.03); }
    this.t=len*beat; this.i++; }};

const held={up:0,down:0,left:0,right:0,A:0,B:0}; const pressed=new Set();
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'up',s:'down',q:'left',d:'right',KeyW:'A',Space:'A',w:'A',x:'B',Shift:'B',Enter:'START',Escape:'START'};
addEventListener('keydown',e=>{ const k=KEYS[e.key]||KEYS[e.code]||KEYS[e.key.toLowerCase()]; if(!k) return; e.preventDefault(); AU.init(); if(!e.repeat) pressed.add(k); if(k in held) held[k]=1; });
addEventListener('keyup',e=>{ const k=KEYS[e.key]||KEYS[e.code]||KEYS[e.key.toLowerCase()]; if(k&&k in held) held[k]=0; });
const dp=$('dpad'); let dpId=null;
function dpDir(e){ const r=dp.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
  for(const k of ['up','down','left','right']) held[k]=0; if(Math.hypot(x,y)<10) return;
  const k=Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up'); if(!held[k]) pressed.add(k); held[k]=1; }
dp.addEventListener('pointerdown',e=>{ AU.init(); dpId=e.pointerId; dp.setPointerCapture(e.pointerId); dpDir(e); });
dp.addEventListener('pointermove',e=>{ if(e.pointerId===dpId) dpDir(e); });
const dpEnd=e=>{ if(e.pointerId!==dpId) return; dpId=null; for(const k of ['up','down','left','right']) held[k]=0; };
dp.addEventListener('pointerup',dpEnd); dp.addEventListener('pointercancel',dpEnd);
for(const [id,k] of [['bA','A'],['bB','B'],['bStart','START'],['bSel','SELECT']]){ const el=$(id);
  el.addEventListener('pointerdown',e=>{ AU.init(); el.setPointerCapture(e.pointerId); el.classList.add('on'); pressed.add(k); if(k in held) held[k]=1; });
  const up=()=>{ el.classList.remove('on'); if(k in held) held[k]=0; }; el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); }
const heldDir=()=>['up','down','left','right'].find(k=>held[k]&&pressed.has(k))||['up','down','left','right'].find(k=>held[k]);
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

/* --- boîte de dialogue et menu ---------------------------------------- */
let dialog=null, menu=null, fade=null, title=true;
/* coupe le texte en lignes de 18 caractères, puis en pages de 2 lignes */
function wrap(text){ const out=[]; for(const para of text.split('\n')){ let line=''; for(const w of para.split(' ')){ if((line+' '+w).trim().length>18&&line){ out.push(line); line=w; } else line=(line+' '+w).trim(); } out.push(line); } return out; }
function say(text){ const pages=[]; const lines=wrap(text); for(let i=0;i<lines.length;i+=2) pages.push(lines.slice(i,i+2).join('\n')); dialog={pages,i:0,shown:0}; showPage(); }
function showPage(){ const b=$('box'); b.style.display='block'; dialog.shown=0; b.innerHTML=''; }
function closeDialog(){ dialog=null; $('box').style.display='none'; }
const MENU_ITEMS=()=>[['CARTE',()=>{ closeMenu(); say(MAPS[P.map].name+'\n'+(P.map==='out'?'Route 1 au nord, l\'étang au sud.':'Ta maison, bien au chaud.')); }],
  ['SAUVER',()=>{ save(); closeMenu(); say('LOAN a sauvegardé\nsa progression !'); AU.ok(); }],
  ['SON : '+(AU.on?'OUI':'NON'),()=>{ AU.on=!AU.on; MUS.on=AU.on; renderMenu(); }],
  ['QUITTER',()=>{ save(); location.href='bienvenue.html?retour=1'; }],['RETOUR',()=>closeMenu()]];
function openMenu(){ menu={i:0}; renderMenu(); $('menu').style.display='block'; AU.ok(); }
function renderMenu(){ $('menu').innerHTML=MENU_ITEMS().map((m,i)=>`<div class="${i===menu.i?'sel':''}" data-i="${i}">${m[0]}</div>`).join(''); }
function closeMenu(){ menu=null; $('menu').style.display='none'; }
$('menu').addEventListener('pointerdown',e=>{ const d=e.target.closest('[data-i]'); if(!d||!menu) return; menu.i=+d.dataset.i; renderMenu(); MENU_ITEMS()[menu.i][1](); });

/* --- déplacements ----------------------------------------------------- */
function interact(){ const [dx,dy]=DIRV[P.dir], x=P.x+dx, y=P.y+dy, t=tileAt(P.map,x,y);
  const key=P.map==='out'?`out:${x},${y}`:`house:${t}`, txt=TEXTS[key]; if(txt){ say(txt); AU.ok(); } }
function warp(map,x,y,dir){ fade={t:0,d:.5,then:()=>{ P.map=map; P.x=x; P.y=y; P.dir=dir; P.mv=null; save(); }}; AU.door(); }
function tryMove(d){ const [dx,dy]=DIRV[d], tx=P.x+dx, ty=P.y+dy, t=tileAt(P.map,tx,ty), run=held.B;
  if(P.map==='house'&&tileAt('house',P.x,P.y)==='m'&&d==='down'){ warp('out',6,22,'down'); return; }
  if(P.map==='out'&&t==='D'&&d==='up'){
    const k=`out:door:${tx},${ty}`; if(TEXTS[k]){ say(TEXTS[k]); return; }
    warp('house',4,7,'up'); return; }
  if(P.map==='out'&&t==='v'&&d==='down'&&!solid('out',tx,ty+1)){ P.mv={fx:P.x,fy:P.y,tx,ty:ty+1,t:0,dur:.42,jump:1}; AU.jump(); return; }
  if(P.map==='out'&&t==='v'){ bump(); return; }
  if(solid(P.map,tx,ty)){ bump(); return; }
  P.mv={fx:P.x,fy:P.y,tx,ty,t:0,dur:run?.13:.26}; }
function bump(){ if(P.bumpT<=0){ AU.bump(); P.bumpT=.26; P.foot^=1; } }
function arrive(){ const m=P.mv; P.x=m.tx; P.y=m.ty; P.mv=null; P.foot^=1; P.steps++;
  if(P.map==='out'&&tileAt('out',P.x,P.y)===':'){ AU.grass(); rustle=.3; }
  save(); }
let rustle=0;
function update(dt){
  if(fade){ fade.t+=dt; if(fade.t>=fade.d/2&&fade.then){ fade.then(); fade.then=null; } if(fade.t>=fade.d) fade=null; pressed.clear(); return; }
  if(title){ if(pressed.has('A')||pressed.has('START')){ title=false; AU.init(); AU.ok(); } pressed.clear(); return; }
  if(menu){ if(pressed.has('up')){ menu.i=(menu.i+MENU_ITEMS().length-1)%MENU_ITEMS().length; renderMenu(); }
    if(pressed.has('down')){ menu.i=(menu.i+1)%MENU_ITEMS().length; renderMenu(); }
    if(pressed.has('A')) MENU_ITEMS()[menu.i][1](); else if(pressed.has('B')||pressed.has('START')) closeMenu();
    pressed.clear(); return; }
  if(dialog){ const pg=dialog.pages[dialog.i]; dialog.shown=Math.min(pg.length,dialog.shown+dt*60);
    const b=$('box'); b.innerHTML=pg.slice(0,Math.floor(dialog.shown)).replace(/</g,'&lt;')+(dialog.shown>=pg.length?'<span class="more">▼</span>':'');
    if(pressed.has('A')||pressed.has('B')){ if(dialog.shown<pg.length) dialog.shown=pg.length; else if(++dialog.i>=dialog.pages.length) closeDialog(); else showPage(); }
    pressed.clear(); return; }
  if(P.bumpT>0) P.bumpT-=dt; if(rustle>0) rustle-=dt;
  if(P.mv){ P.mv.t+=dt; if(P.mv.t>=P.mv.dur) arrive(); }
  if(!P.mv&&!fade){
    if(pressed.has('START')){ pressed.clear(); openMenu(); return; }
    if(pressed.has('A')){ interact(); pressed.clear(); return; }
    const d=heldDir();
    /* un appui bref tourne le dresseur sur place, un appui maintenu le fait marcher */
    if(!d) P.turnT=0;
    else if(d!==P.dir){ P.dir=d; P.turnT=pressed.has(d)?.1:0; if(!P.turnT) tryMove(d); }
    else if(P.turnT>0) P.turnT-=dt;
    else tryMove(d);
  }
  pressed.clear();
}

/* --- rendu ------------------------------------------------------------- */
let T=0;
function drawTile(m,t,x,y,sx,sy){
  if(m==='out'){
    const v=((x*7+y*13)%5+5)%5, base=GRASS[v%3];
    switch(t){
      case '=': ctx.drawImage(PATH,sx,sy); break;
      case ':': ctx.drawImage(TALL,sx,sy); break;
      case 'f': ctx.drawImage(FLOWER[Math.floor(T*2.2+x)%2],sx,sy); break;
      case '~': ctx.drawImage(WATER[Math.floor(T*2.5)%3],sx,sy);
        if(tileAt(m,x,y-1)!=='~'){ ctx.fillStyle=PAL.d; ctx.fillRect(sx,sy,16,2); }
        if(tileAt(m,x+1,y)!=='~'&&tileAt(m,x+1,y)!=='T'){ ctx.fillStyle=PAL.d; ctx.fillRect(sx+14,sy,2,16); } break;
      case 'T': ctx.drawImage(base,sx,sy); ctx.drawImage(TREE,sx,sy); break;
      case 'v': ctx.drawImage(LEDGE,sx,sy); break;
      case '#': ctx.drawImage(FENCE,sx,sy); break;
      case 'S': ctx.drawImage(SIGN,sx,sy); break;
      case 'M': ctx.drawImage(MAILBOX,sx,sy); break;
      case 'r': ctx.drawImage(ROCK,sx,sy); break;
      case 'B': case 'D': ctx.drawImage(PATH,sx,sy); break;
      default: ctx.drawImage(base,sx,sy);
    }
    /* bordures douces du chemin */
    if(t==='='){ ctx.fillStyle=PAL.D; for(const [dx,dy,rx,ry,rw,rh] of [[0,-1,0,0,16,1],[0,1,0,15,16,1],[-1,0,0,0,1,16],[1,0,15,0,1,16]]){
      const n=tileAt(m,x+dx,y+dy); if(n!=='='&&n!=='B'&&n!=='D') ctx.fillRect(sx+rx,sy+ry,rw,rh); } }
  } else {
    switch(t){
      case 'w': ctx.drawImage(y===0?WALLTOP:(x%4===1?WINDOW:WALL),sx,sy); break;
      case 'm': ctx.drawImage(MAT,sx,sy); break;
      case ' ': ctx.fillStyle='#000'; ctx.fillRect(sx,sy,16,16); break;
      default: ctx.drawImage(FLOOR,sx,sy);
    }
  }
}
/* meubles de l'intérieur (dessinés une fois par bloc) */
function drawFurniture(cx,cy){ const M=MAPS.house; const done=new Set();
  for(let y=0;y<M.h;y++) for(let x=0;x<M.w;x++){ const t=M.rows[y][x], sx=x*16-cx, sy=y*16-cy;
    if(t==='K'&&!done.has('K')){ done.add('K'); ctx.drawImage(SHELF,sx,sy-1); }
    if(t==='t') ctx.drawImage(TV,sx,sy);
    if(t==='v') ctx.drawImage(PLANT,sx,sy);
    if(t==='B'&&!done.has('B')){ done.add('B'); ctx.drawImage(BED,sx,sy); }
    if(t==='c'&&!done.has('c')){ done.add('c'); ctx.drawImage(TABLE,sx,sy+2); } } }
function playerPos(){ if(!P.mv) return [P.x*16,P.y*16,0]; const m=P.mv, k=Math.min(1,m.t/m.dur);
  return [(m.fx+(m.tx-m.fx)*k)*16,(m.fy+(m.ty-m.fy)*k)*16,m.jump?Math.sin(k*Math.PI)*10:0]; }
function playerSprite(){ const d=P.dir; let walking=false;
  if(P.mv&&!P.mv.jump) walking=(P.mv.t/P.mv.dur)<.5; else if(P.bumpT>0) walking=P.bumpT>.13;
  if(!walking) return PS[d];
  if(d==='down') return P.foot?PS.downW2:PS.downW; if(d==='up') return P.foot?PS.upW2:PS.upW; return PS[d+'W']; }
function render(){
  const M=MAPS[P.map], [px,py,jz]=playerPos();
  const cx=Math.round(px-64), cy=Math.round(py-64);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const x0=Math.floor(cx/16), y0=Math.floor(cy/16);
  for(let ty=y0;ty<=y0+9;ty++) for(let tx=x0;tx<=x0+10;tx++) drawTile(P.map,tileAt(P.map,tx,ty),tx,ty,tx*16-cx,ty*16-cy);
  for(const b of M.build) ctx.drawImage(b.img,b.x*16-cx,b.y*16-cy);
  if(P.map==='house') drawFurniture(cx,cy);
  /* joueur (les sprites sont décalés de 4 px vers le haut, comme sur cartouche) */
  const sx=Math.round(px-cx), sy=Math.round(py-cy)-4;
  if(jz){ ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(sx+8,sy+18,6,2,0,0,Math.PI*2); ctx.fill(); }
  ctx.drawImage(playerSprite(),sx,Math.round(sy-jz));
  /* hautes herbes : elles recouvrent le bas du dresseur */
  const gx=Math.round(px/16), gy=Math.round(py/16);
  if(P.map==='out'&&tileAt('out',gx,gy)===':'&&!jz){ ctx.drawImage(TALL,0,8,16,8,gx*16-cx,gy*16-cy+8,16,8);
    if(rustle>0){ ctx.fillStyle=PAL.l; for(let i=0;i<4;i++) ctx.fillRect(gx*16-cx+2+i*4,gy*16-cy+6-rustle*20+(i%2)*3,2,2); } }
  /* écran titre */
  if(title) drawTitle();
  /* fondu de porte */
  const f=$('flash'); if(fade){ const k=fade.t/fade.d; f.style.background='#000'; f.style.opacity=k<.5?k*2:2-k*2; } else if(!boot) f.style.opacity=0;
}
function drawTitle(){ const sky=ctx.createLinearGradient(0,0,0,80); sky.addColorStop(0,'#3a2a8a'); sky.addColorStop(1,'#f0a0c0');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,80); for(let x=0;x<W;x+=16) for(let y=80;y<H;y+=16) ctx.drawImage(GRASS[(x/16+y/16)%3],x,y);
  for(let x=0;x<W;x+=16){ ctx.drawImage(TREE,x,64); } for(let x=16;x<W;x+=40) ctx.drawImage(FLOWER[Math.floor(T*2.2+x)%2],x,104);
  ctx.fillStyle='rgba(255,255,255,.8)'; for(let i=0;i<12;i++){ ctx.fillRect((i*37+T*6)%W,8+(i*23)%40,1,1); }
  const g=ctx; g.drawImage(PS.down,72,82);
  txt('AVENTURE',80,22,'#ffd84a',2); txt('DE POCHE',80,34,'#5ad0ff',1);

function txt(s,x,y,col,sc){ const w=s.length*4*sc-sc; let X=Math.round(x-w/2); ctx.fillStyle='#000';
  for(const pass of [1,0]){ let xx=X; for(const ch of s){ const f=FONT[ch]||FONT[' ']; for(let i=0;i<15;i++) if(f[i]==='1'){ ctx.fillStyle=pass?'#181030':col; ctx.fillRect(xx+(i%3)*sc+pass*sc,y+Math.floor(i/3)*sc+pass*sc,sc,sc); } xx+=4*sc; } } }

/* --- taille de l'écran (pixels entiers quand c'est possible) ----------- */
function fit(){ const aw=Math.min(innerWidth-48,900), ah=innerHeight-320; let s=Math.min(aw/W,ah/H); s=s>=2?Math.floor(s):Math.max(1,s);
  cv.style.width=W*s+'px'; cv.style.height=H*s+'px'; $('screen').style.setProperty('--s',s); document.documentElement.style.setProperty('--s',s); }
addEventListener('resize',fit); fit();

/* --- démarrage : allumage façon console -------------------------------- */
let boot=/[?&]portail=1/.test(location.search)?1:0;
if(boot){ history.replaceState(null,'',location.pathname); const f=$('flash'); f.style.opacity=1; f.style.transition='opacity 1.2s ease-out'; setTimeout(()=>{ f.style.opacity=0; setTimeout(()=>{ boot=0; f.style.transition=''; },1300); },250); }
let last=performance.now();
function frame(now){ requestAnimationFrame(frame); let dt=(now-last)/1000; last=now; if(dt>.05) dt=.05; T+=dt; update(dt); MUS.tick(dt); render(); }
requestAnimationFrame(frame);
addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
</script>
